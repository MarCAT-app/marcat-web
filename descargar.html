<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarrega MàrCAT</title>

  <!-- Redirección automática a Google Play -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.mercat.mercat&pcampaignid=web_share">

  <!-- Por si el usuario comparte el enlace en redes, que se vea bien -->
  <meta property="og:title" content="MàrCAT — Mercats de segona mà de Catalunya">
  <meta property="og:description" content="Descarrega MàrCAT i descobreix tots els mercats de segona mà, brocanters i encants de Catalunya.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --verd: #2D4A3E;
      --crema: #FAF6F0;
      --terracota: #C97B3D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--crema);
      color: var(--verd);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; margin-bottom: 24px; color: #5A5A5A; }
    a {
      display: inline-block;
      background-color: var(--verd);
      color: var(--crema);
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1rem;
    }
    a:hover { background-color: #24392F; }
  </style>
</head>
<body>
  <h1>Redirigint a Google Play…</h1>
  <p>Si no passa res automàticament, fes clic al botó:</p>
  <a href="https://play.google.com/store/apps/details?id=com.mercat.mercat&pcampaignid=web_share">
    Descarregar MàrCAT
  </a>

  <!-- Respaldo por JavaScript, por si el meta refresh falla -->
  <script>
    window.location.href = "https://play.google.com/store/apps/details?id=com.mercat.mercat&pcampaignid=web_share";
  </script>
</body>
</html>
